<!doctype html><html><meta charset="utf-8"><title>Groundwater import audit</title><script>
window.worker=new Worker('worker.js',{type:'module'});
window.run=data=>new Promise((resolve,reject)=>{worker.onmessage=({data})=>data.error?reject(Error(data.error)):resolve(data.result);worker.onerror=e=>reject(Error(e.message));worker.postMessage({...data,base:location.origin})});
</script></html>
