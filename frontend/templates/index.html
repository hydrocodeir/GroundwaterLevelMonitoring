<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>داشبورد پایش آب زیرزمینی</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('assets', path='img/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('assets', path='img/favicon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('assets', path='img/favicon-192.png') }}">
    <link rel="stylesheet" href="{{ url_for('assets', path='css/leaflet.css') }}">
    <link rel="stylesheet" href="{{ url_for('assets', path='css/app.css') }}?v={{ asset_version }}">
    <script defer src="{{ url_for('assets', path='js/htmx.min.js') }}"></script>
    <script defer src="{{ url_for('assets', path='js/leaflet.js') }}"></script>
    <script defer src="{{ url_for('assets', path='js/echarts.min.js') }}"></script>
    <script defer src="{{ url_for('assets', path='js/echarts-extension-leaflet.js') }}"></script>
    <script defer src="{{ url_for('assets', path='js/app.js') }}?v={{ asset_version }}"></script>
  </head>
  <body class="dashboard-page workspace-page">
    <a class="skip-link" href="#dashboardContent">رفتن به فضای تحلیل</a>
    {% set active_page = 'analysis' %}
    {% include 'partials/site_header.html' %}
    <div class="workspace-container">
      <form id="aquiferSelectionForm" class="aquifer-picker" hx-get="/partials/dashboard"
        hx-target="#dashboardContent" hx-swap="innerHTML" hx-indicator="#loadingIndicator">
        <div class="picker-heading">
          <h1>انتخاب آبخوان</h1>
          <div class="selection-tab-list" role="tablist" aria-label="روش انتخاب آبخوان">
            <button class="selection-tab-button is-active" type="button" data-selection-tab="dropdown" role="tab" aria-selected="true" id="picker-tab-dropdown" aria-controls="picker-panel-dropdown" tabindex="0">از فهرست</button>
            <button class="selection-tab-button" type="button" data-selection-tab="map" role="tab" aria-selected="false" id="picker-tab-map" aria-controls="picker-panel-map" tabindex="-1">از نقشه</button>
          </div>
        </div>
        <input id="selectedAquiferId" type="hidden" name="aquifer_id">
        <div class="picker-fields" data-selection-panel="dropdown" id="picker-panel-dropdown" role="tabpanel" aria-labelledby="picker-tab-dropdown">
          <label for="mahdoudeSelect">محدوده مطالعاتی
            <select class="field" id="mahdoudeSelect" name="mahdoude" hx-get="/partials/aquifers"
              hx-target="#aquiferSelect" hx-trigger="change" hx-swap="innerHTML">
              {% for item in navigation %}<option value="{{ item.key }}">{{ item.name }}</option>{% endfor %}
            </select>
          </label>
          <label for="aquiferSelect">آبخوان
            <select class="field" id="aquiferSelect">
              {% if navigation %}{% for aquifer in navigation[0].aquifers %}
                <option value="{{ aquifer.id }}">{{ aquifer.name }} · {{ aquifer.well_count }} پیزومتر</option>
              {% endfor %}{% endif %}
            </select>
          </label>
          <button id="showDashboardButton" type="submit" class="primary-button" disabled>انتخاب و ادامه <span aria-hidden="true">←</span></button>
        </div>
        <div data-selection-panel="map" id="picker-panel-map" role="tabpanel" aria-labelledby="picker-tab-map" class="hidden picker-map">
          <p>روی آبخوان کلیک کنید، سپس «انتخاب و ادامه» را بزنید.</p>
          <div class="selection-map-shell"><div id="aquiferSelectionMap" class="selection-map-canvas"></div></div>
          <button type="submit" class="primary-button">انتخاب و ادامه <span aria-hidden="true">←</span></button>
        </div>
        <div id="selectedAquiferBadge" class="picker-selection-note" aria-live="polite"></div>
      </form>
      <main id="dashboardContent" tabindex="-1">
        <section class="workspace-welcome">
          <p>برای نمایش پیزومترها، آبخوان را انتخاب کنید.</p>
        </section>
      </main>
      <div id="loadingIndicator" class="htmx-indicator picker-loading" role="status">در حال دریافت اطلاعات…</div>
    </div>

    <aside id="aquiferChatWidget" class="aquifer-chat-widget hidden" aria-live="polite">
      <section id="aquiferChatPanel" class="aquifer-chat-panel hidden" aria-label="گفتگو درباره آبخوان">
        <header class="aquifer-chat-header">
          <div class="min-w-0">
            <div class="text-[10px] font-bold text-aqua">دستیار آبخوان</div>
            <h2 id="aquiferChatTitle" class="mt-0.5 truncate text-sm font-bold text-white">گفتگو با AI</h2>
          </div>
          <div class="flex items-center gap-2">
            <button id="aquiferChatClear" type="button" class="aquifer-chat-header-button">پاک‌کردن</button>
            <button id="aquiferChatClose" type="button" class="aquifer-chat-close" aria-label="بستن گفتگو">×</button>
          </div>
        </header>

        <div class="aquifer-chat-settings">
          <label>
            <span>ارائه‌دهنده</span>
            <select id="aquiferChatProvider"></select>
          </label>
          <label>
            <span>مدل</span>
            <select id="aquiferChatModel" dir="ltr"></select>
          </label>
          <div id="aquiferChatModelHint" class="aquifer-chat-model-hint"></div>
        </div>

        <div id="aquiferChatMessages" class="aquifer-chat-messages"></div>
        <div id="aquiferChatStatus" class="hidden px-4 py-2 text-[10px] leading-5 text-red-700"></div>

        <form id="aquiferChatForm" class="aquifer-chat-form">
          <textarea
            id="aquiferChatInput"
            rows="2"
            maxlength="2000"
            placeholder="درباره آبخوان، روند افت یا یک پیزومتر سؤال کنید..."
          ></textarea>
          <button id="aquiferChatSend" type="submit">ارسال</button>
        </form>
      </section>

      <button id="aquiferChatToggle" type="button" class="aquifer-chat-toggle" aria-expanded="false">
        <span class="aquifer-chat-toggle-icon" aria-hidden="true">AI</span>
        <span>گفتگو درباره آبخوان</span>
      </button>
    </aside>
  </body>
</html>
